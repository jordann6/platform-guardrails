name: Terraform Plan Guardrails (credentialed)

# Reusable workflow for the gates that need a real cloud read: the plan itself,
# the destroy guard, and the cost diff. Authenticates with OIDC only. If you are
# passing a static access key into this, stop and fix that first.

on:
  workflow_call:
    inputs:
      guardrails_ref:
        description: >-
          platform-guardrails commit whose scripts and policies this run uses. Pass the
          same SHA the caller pins in `uses:`, so the reviewed workflow and the scripts it
          runs match. Empty falls back to the default branch (pre-v1.5.0 behavior).
        type: string
        default: ""
      terraform_dir:
        type: string
        default: terraform
      terraform_version:
        type: string
        default: 1.11.3
      build_command:
        description: >-
          Shell command run from terraform_dir before any cloud login, for roots that
          package local artifacts Terraform reads at plan time (a Lambda with pip
          dependencies, say). It carries the same trust as the Terraform it builds
          for. Empty skips it.
        type: string
        default: ""
      aws_role_arn:
        description: Role to assume via GitHub OIDC. Leave empty for non-AWS.
        type: string
        default: ""
      aws_region:
        type: string
        default: us-east-2
      gcp_workload_identity_provider:
        description: GCP Workload Identity Federation provider resource name (projects/N/locations/global/workloadIdentityPools/P/providers/X). Empty for non-GCP.
        type: string
        default: ""
      gcp_service_account:
        description: GCP service account to impersonate through the WIF provider. Empty for non-GCP.
        type: string
        default: ""
      azure_client_id:
        description: Client ID of the Azure identity (user-assigned managed identity or app registration) with a federated credential for this repo. Empty for non-Azure.
        type: string
        default: ""
      azure_tenant_id:
        description: Entra tenant ID. Required with an Azure client ID.
        type: string
        default: ""
      azure_subscription_id:
        description: Subscription the azurerm provider and backend default to. Required with an Azure client ID.
        type: string
        default: ""
      environment:
        description: GitHub environment to bind to (for required reviewers).
        type: string
        default: ""
      enable_infracost:
        description: Post a cost diff comment. Needs the INFRACOST_API_KEY secret.
        type: boolean
        default: false
    secrets:
      INFRACOST_API_KEY:
        required: false
    outputs:
      has_changes:
        description: >-
          "true" when the plan would change resources or outputs, "false" when it is
          empty. A caller re-planning right after an apply asserts "false", which is
          the perpetual-diff check.
        value: ${{ jobs.plan.outputs.has_changes }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan + destroy guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    # Exported to every step so a root can declare an ephemeral `ci_stage`
    # variable and pick a stage-specific identity (for example a read-only role in
    # a member account) in its provider configuration. Roots that do not declare
    # it ignore it: Terraform skips TF_VAR_ values for undeclared variables.
    env:
      TF_VAR_ci_stage: plan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch guardrail scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jordann6/platform-guardrails
          ref: ${{ inputs.guardrails_ref }}
          path: .guardrails-src

      # Before any cloud login: a build needs the network, not credentials. The
      # command arrives through the environment, never interpolated into the script.
      - name: Build local artifacts
        if: inputs.build_command != ''
        working-directory: ${{ inputs.terraform_dir }}
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Configure AWS credentials (OIDC)
        if: inputs.aws_role_arn != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # GCP path, same contract as the AWS one: OIDC only, no key file. The
      # action exchanges the GitHub token through the WIF provider and writes an
      # external-account credential config that the google provider reads via
      # GOOGLE_APPLICATION_CREDENTIALS. Nothing long-lived touches the runner.
      - name: Authenticate to GCP (OIDC via WIF)
        if: inputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}

      # Azure path, same contract as AWS and GCP: OIDC only, no client secret.
      # azure/login gives the az CLI a federated token; the ARM_* variables put the
      # azurerm and azuread providers and the azurerm backend on the same GitHub
      # token (ARM_USE_OIDC). Nothing long-lived touches the runner.
      - name: Authenticate to Azure (OIDC)
        if: inputs.azure_client_id != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Point Terraform at the Azure federated identity
        if: inputs.azure_client_id != ''
        env:
          CLIENT_ID: ${{ inputs.azure_client_id }}
          TENANT_ID: ${{ inputs.azure_tenant_id }}
          SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_USE_AZUREAD=true"
            echo "ARM_CLIENT_ID=${CLIENT_ID}"
            echo "ARM_TENANT_ID=${TENANT_ID}"
            echo "ARM_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}"
          } >> "$GITHUB_ENV"

      # No wrapper: it reports exit code 2 (a plan with changes) as success and
      # exits 0, which would hide -detailed-exitcode from the Plan step below.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      # -detailed-exitcode: 0 is an empty plan, 2 is a plan with changes, 1 is an error.
      - name: Plan
        id: plan
        run: |
          terraform -chdir=${{ inputs.terraform_dir }} init
          set +e
          terraform -chdir=${{ inputs.terraform_dir }} plan -out=tfplan -input=false -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          terraform -chdir=${{ inputs.terraform_dir }} show -json tfplan \
            > "${{ inputs.terraform_dir }}/plan.json"

      # The gate that stops a clean-looking apply from taking a database with it.
      # Bypassed only by labelling the pull request 'destroy-approved'.
      - name: Destroy guard
        env:
          DESTROY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'destroy-approved') }}
        run: |
          chmod +x .guardrails-src/scripts/destroy-guard.sh
          .guardrails-src/scripts/destroy-guard.sh ${{ inputs.terraform_dir }}/plan.json

      - name: Summarise plan
        if: always()
        run: |
          if [ -f "${{ inputs.terraform_dir }}/plan.json" ]; then
            {
              echo "### Terraform plan"
              echo ""
              echo '```'
              jq -r '.resource_changes[]?
                | select(.change.actions != ["no-op"])
                | "\(.change.actions | join("+"))  \(.address)"' \
                "${{ inputs.terraform_dir }}/plan.json" | sort
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Infracost
        if: inputs.enable_infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Cost diff
        if: inputs.enable_infracost && github.event_name == 'pull_request'
        run: |
          infracost breakdown --path "${{ inputs.terraform_dir }}/plan.json" \
            --format json --out-file /tmp/infracost.json
          infracost comment github \
            --path /tmp/infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --github-token "${{ github.token }}" \
            --behavior update
