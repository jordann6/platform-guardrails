name: Self test

# The guardrails repo has to prove its own gates still gate. Every change here
# runs the policy suite against a compliant fixture (must pass clean) and a
# deliberately non-compliant one (must be blocked), plus both destroy-guard
# paths. A policy that silently stops matching is worse than no policy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Policy fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install conftest
        run: |
          VERSION=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Compliant fixture must pass
        run: conftest test --parser hcl2 --combine --policy policy examples/pass/main.tf

      - name: Non-compliant fixture must fail
        run: |
          if conftest test --parser hcl2 --combine --policy policy examples/fail/main.tf; then
            echo "::error::The non-compliant fixture passed. The policies are not gating."
            exit 1
          fi
          echo "Non-compliant fixture was blocked as expected."

      - name: Compliant GCP fixture must pass
        run: conftest test --parser hcl2 --combine --policy policy examples/pass-gcp/main.tf

      - name: Non-compliant GCP fixture must fail
        run: |
          if conftest test --parser hcl2 --combine --policy policy examples/fail-gcp/main.tf; then
            echo "::error::The non-compliant GCP fixture passed. The GCP rules are not gating."
            exit 1
          fi
          echo "Non-compliant GCP fixture was blocked as expected."

  destroy_guard:
    name: Destroy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Safe plan is allowed
        run: scripts/destroy-guard.sh examples/plans/safe-plan.json

      - name: Destructive plan is blocked
        run: |
          if scripts/destroy-guard.sh examples/plans/destructive-plan.json; then
            echo "::error::Destroy guard allowed deletion of a protected resource."
            exit 1
          fi
          echo "Destroy guard blocked the deletion as expected."

      - name: Approved destructive plan is allowed
        env:
          DESTROY_APPROVED: "true"
        run: scripts/destroy-guard.sh examples/plans/destructive-plan.json

  hourly_guard:
    name: Hourly guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clean state is allowed
        run: scripts/hourly-guard.sh examples/state/clean.txt

      - name: State with hourly resources is flagged
        run: |
          if scripts/hourly-guard.sh examples/state/with-hourly.txt; then
            echo "::error::Hourly guard passed a state that contains a NAT gateway and an RDS instance."
            exit 1
          fi
          echo "Hourly guard flagged the standing resources as expected."

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck scripts/*.sh scripts/tests/*.sh install.sh

  contract:
    name: Contract publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/tests/publish-contract.test.sh

  # tf-plan and tf-apply report has_changes from `plan -detailed-exitcode`. The
  # setup-terraform wrapper turns exit code 2 into 0, which made every plan read
  # as empty and skipped every gated apply (fixed in v1.7.1). Prove both halves:
  # the callables disable the wrapper, and with it disabled the codes come through.
  detailed_exitcode:
    name: Detailed exit code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Callables that use -detailed-exitcode disable the wrapper
        run: |
          status=0
          while IFS= read -r f; do
            uses=$(grep -c 'hashicorp/setup-terraform@' "$f")
            off=$(grep -c 'terraform_wrapper: false' "$f")
            echo "$f: setup-terraform=$uses wrapper-off=$off"
            # tf-apply has two setup steps; only its plan job needs the exit code.
            if [ "$off" -lt 1 ]; then
              echo "::error::$f plans with -detailed-exitcode but leaves the setup-terraform wrapper on."
              status=1
            fi
          done < <(grep -l -- '-detailed-exitcode' .github/workflows/tf-*.yml)
          exit $status

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.3
          terraform_wrapper: false

      - name: A plan with changes exits 2, an empty plan exits 0
        run: |
          mkdir -p "$RUNNER_TEMP/exitcode" && cd "$RUNNER_TEMP/exitcode"
          echo 'resource "terraform_data" "probe" {}' > main.tf
          terraform init -input=false >/dev/null
          set +e
          terraform plan -input=false -detailed-exitcode >/dev/null; changes=$?
          terraform apply -input=false -auto-approve >/dev/null
          terraform plan -input=false -detailed-exitcode >/dev/null; empty=$?
          set -e
          echo "with changes: $changes (want 2), empty: $empty (want 0)"
          [ "$changes" -eq 2 ] && [ "$empty" -eq 0 ]
