name: CI

# Unified reusable CI workflow for the portfolio fleet.
# Auto-detects stack and runs appropriate gates. SARIF upload puts findings
# in the GitHub Security tab for maximum recruiter visibility.
#
# Usage in caller repo:
#   jobs:
#     ci:
#       uses: jordann6/platform-guardrails/.github/workflows/ci.yml@v1
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         enforce_iac: true  # optional, default false (report-only)

on:
  workflow_call:
    inputs:
      terraform_dir:
        description: Directory holding the root Terraform module.
        type: string
        default: terraform
      enforce_iac:
        description: Fail on IaC findings (Checkov/Trivy). False = report-only.
        type: boolean
        default: false
      enforce_sast:
        description: Fail on SAST findings (Bandit). False = report-only.
        type: boolean
        default: false
      enforce_container:
        description: Fail on container scan findings. False = report-only.
        type: boolean
        default: false
      skip_container:
        description: Skip container scan even if Dockerfile exists.
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      has_terraform: ${{ steps.scan.outputs.has_terraform }}
      has_python: ${{ steps.scan.outputs.has_python }}
      has_dockerfile: ${{ steps.scan.outputs.has_dockerfile }}
      has_node: ${{ steps.scan.outputs.has_node }}
      has_go: ${{ steps.scan.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          tf=false; py=false; dk=false; node=false; go=false
          [ -n "$(find . -name '*.tf' -not -path './.git/*' -print -quit)" ] && tf=true
          [ -n "$(find . -name '*.py' -not -path './.git/*' -not -path '*/.venv/*' -not -path '*/venv/*' -print -quit)" ] && py=true
          [ -n "$(find . -iname 'Dockerfile*' -not -path './.git/*' -print -quit)" ] && dk=true
          [ -f "package.json" ] && node=true
          [ -f "go.mod" ] && go=true
          echo "has_terraform=$tf" >> "$GITHUB_OUTPUT"
          echo "has_python=$py"    >> "$GITHUB_OUTPUT"
          echo "has_dockerfile=$dk" >> "$GITHUB_OUTPUT"
          echo "has_node=$node"    >> "$GITHUB_OUTPUT"
          echo "has_go=$go"        >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_terraform == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init + validate (all roots)
        run: |
          for d in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "==> $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate -no-color
          done

  iac:
    name: IaC scan (Checkov + Trivy)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_terraform == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Checkov scan
        id: checkov
        run: |
          pip install --quiet checkov
          checkov -d . --framework terraform --quiet --compact \
            -o sarif -o cli --output-file-path . \
            ${{ inputs.enforce_iac && ' ' || '--soft-fail' }} || true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results_sarif.sarif
          category: checkov
        continue-on-error: true

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          exit-code: ${{ inputs.enforce_iac && '1' || '0' }}
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
        continue-on-error: true

  python:
    name: Python SAST (Bandit + pip-audit)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bandit SAST
        run: |
          pip install --quiet bandit
          bandit -r . -ll -x ./.venv,./venv,./node_modules,./tests \
            -f sarif -o bandit.sarif \
            ${{ inputs.enforce_sast && ' ' || '|| true' }}

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
        continue-on-error: true

      - name: pip-audit
        run: |
          pip install --quiet pip-audit
          req=$(find . -maxdepth 2 -name 'requirements*.txt' -not -path '*/.venv/*' | head -1)
          if [ -n "$req" ]; then
            pip-audit -r "$req" ${{ inputs.enforce_sast && ' ' || '|| true' }}
          fi

  container:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_dockerfile == 'true' && !inputs.skip_container
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          df=$(find . -iname 'Dockerfile' -not -path './.git/*' | head -1)
          docker build -f "$df" -t local-scan:${{ github.sha }} "$(dirname "$df")"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local-scan:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          exit-code: ${{ inputs.enforce_container && '1' || '0' }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container
        continue-on-error: true

  node:
    name: Node.js audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        run: npm audit --audit-level=high || true

  go:
    name: Go security (govulncheck)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true
