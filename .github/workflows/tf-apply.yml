name: Terraform Apply Guardrails (gated)

# Reusable workflow for a credentialed, reviewer-gated apply. This is the
# just-in-time-to-prod control expressed in CI: no standing permission to change
# infrastructure, elevation is a recorded, approved act.
#
# The gate is a GitHub environment with a required reviewer. It is enforced by
# splitting the run into two jobs:
#
#   plan   – authenticates read-only, produces the exact plan, runs the destroy
#            guard, and saves that plan as an artifact. No environment, so it
#            runs immediately and the reviewer has something to look at.
#   apply  – bound to the environment, so it pauses for approval before it does
#            anything, then applies the SAVED plan from the plan job. The
#            reviewer approves the specific change they read, not a promise to
#            re-plan.
#
# Two roles by design: plan assumes a read-scoped role, apply assumes a
# write-scoped one that only the environment can reach. A read token can never
# mutate, even if the plan job is compromised by PR-authored Terraform.

on:
  workflow_call:
    inputs:
      guardrails_ref:
        description: >-
          platform-guardrails commit whose scripts and policies this run uses. Pass the
          same SHA the caller pins in `uses:`, so the reviewed workflow and the scripts it
          runs match. Empty falls back to the default branch (pre-v1.5.0 behavior).
        type: string
        default: ""
      terraform_dir:
        type: string
        default: terraform
      terraform_version:
        type: string
        default: 1.11.3
      environment:
        description: GitHub environment gating the apply (must have a required reviewer).
        type: string
        required: true
      plan_role_arn:
        description: Read-scoped role assumed via OIDC for the plan. Empty for non-AWS.
        type: string
        default: ""
      apply_role_arn:
        description: Write-scoped role assumed via OIDC for the apply. Empty for non-AWS.
        type: string
        default: ""
      aws_region:
        type: string
        default: us-east-1
      gcp_workload_identity_provider:
        description: GCP Workload Identity Federation provider resource name. Empty for non-GCP.
        type: string
        default: ""
      gcp_plan_service_account:
        description: Read-scoped GCP service account impersonated for the plan. Empty for non-GCP.
        type: string
        default: ""
      gcp_apply_service_account:
        description: Write-scoped GCP service account impersonated for the apply. Its WIF binding should be conditioned on the environment claim so only the gated job can reach it.
        type: string
        default: ""
      contract_parameter:
        description: >-
          SSM parameter to publish the deployment contract to after a successful apply
          (scripts/publish-contract.sh). Empty disables publishing. The apply role needs
          ssm:PutParameter on it.
        type: string
        default: ""
      contract_allowlist:
        description: Allowlist of output names to publish, relative to terraform_dir.
        type: string
        default: contract-allowlist.txt
      contract_version:
        description: contract_version written into the document.
        type: string
        default: "1"
    outputs:
      contract_parameter:
        description: SSM parameter the contract was published to, when publishing is enabled.
        value: ${{ jobs.apply.outputs.contract_parameter }}
      generation_id:
        description: generation_id from the published contract, when the root outputs one.
        value: ${{ jobs.apply.outputs.generation_id }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan + destroy guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch guardrail scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jordann6/platform-guardrails
          ref: ${{ inputs.guardrails_ref }}
          path: .guardrails-src

      - name: Configure AWS credentials (OIDC, read-scoped)
        if: inputs.plan_role_arn != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.plan_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # GCP path, same contract as the AWS one: OIDC only, no key file. The
      # action exchanges the GitHub token through the WIF provider and writes an
      # external-account credential config that the google provider reads via
      # GOOGLE_APPLICATION_CREDENTIALS. Nothing long-lived touches the runner.
      - name: Authenticate to GCP (OIDC via WIF, read-scoped)
        if: inputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_plan_service_account }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Plan
        run: |
          terraform -chdir=${{ inputs.terraform_dir }} init
          terraform -chdir=${{ inputs.terraform_dir }} plan -out=tfplan -input=false
          terraform -chdir=${{ inputs.terraform_dir }} show -json tfplan \
            > "${{ inputs.terraform_dir }}/plan.json"

      # Same gate as tf-plan.yml: a delete or replace of a stateful resource is
      # blocked unless the PR carries 'destroy-approved'. An apply is exactly
      # when that matters, because here the plan actually runs.
      - name: Destroy guard
        env:
          DESTROY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'destroy-approved') }}
        run: |
          chmod +x .guardrails-src/scripts/destroy-guard.sh
          .guardrails-src/scripts/destroy-guard.sh ${{ inputs.terraform_dir }}/plan.json

      - name: Summarise plan
        if: always()
        run: |
          if [ -f "${{ inputs.terraform_dir }}/plan.json" ]; then
            {
              echo "### Terraform plan (pending approval on '${{ inputs.environment }}')"
              echo ""
              echo '```'
              jq -r '.resource_changes[]?
                | select(.change.actions != ["no-op"])
                | "\(.change.actions | join("+"))  \(.address)"' \
                "${{ inputs.terraform_dir }}/plan.json" | sort
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The binary plan is what apply consumes, so the reviewer approves exactly
      # what runs. plan.json rides along for the record.
      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: |
            ${{ inputs.terraform_dir }}/tfplan
            ${{ inputs.terraform_dir }}/plan.json
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply (gated)
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      contract_parameter: ${{ steps.contract.outputs.contract_parameter }}
      generation_id: ${{ steps.contract.outputs.generation_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout guardrail scripts
        if: inputs.contract_parameter != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jordann6/platform-guardrails
          ref: ${{ inputs.guardrails_ref }}
          path: .guardrails-src

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: ${{ inputs.terraform_dir }}

      - name: Configure AWS credentials (OIDC, write-scoped)
        if: inputs.apply_role_arn != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.apply_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # GCP path, same contract as the AWS one: OIDC only, no key file. The
      # action exchanges the GitHub token through the WIF provider and writes an
      # external-account credential config that the google provider reads via
      # GOOGLE_APPLICATION_CREDENTIALS. Nothing long-lived touches the runner.
      - name: Authenticate to GCP (OIDC via WIF, write-scoped)
        if: inputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_apply_service_account }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}

      # init re-materialises the providers this runner needs to apply the saved
      # plan; the plan file itself is not re-generated, it is replayed.
      - name: Apply saved plan
        run: |
          terraform -chdir=${{ inputs.terraform_dir }} init
          terraform -chdir=${{ inputs.terraform_dir }} apply -input=false tfplan

      # Explicit output handoff: application pipelines read this allowlisted
      # document instead of Terraform state or duplicated resource names.
      - name: Publish deployment contract
        id: contract
        if: inputs.contract_parameter != ''
        run: |
          .guardrails-src/scripts/publish-contract.sh "${{ inputs.terraform_dir }}" \
            "${{ inputs.contract_parameter }}" \
            "${{ inputs.terraform_dir }}/${{ inputs.contract_allowlist }}" \
            "${{ inputs.contract_version }}"
